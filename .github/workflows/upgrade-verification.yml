name: Upgrade Verification

on:
  push:
    branches:
      - my-config-v2026.10.10
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-verification-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.22.1"

jobs:
  typecheck:
    name: Typecheck (core, packages, extensions)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Typecheck core and packages
        run: pnpm tsgo:core
      - name: Typecheck extensions (production and tests)
        run: pnpm tsgo:extensions:all

  cjk-companion-test:
    name: Han bigram companion index test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run the companion index regression test
        run: >-
          pnpm exec vitest run
          --config test/vitest/vitest.extension-memory.config.ts
          extensions/memory-core/src/memory/manager-search.cjk-bigram.test.ts
          --maxWorkers=1
