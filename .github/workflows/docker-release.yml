name: Docker Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example 2026.9.4 or v2026.9.4)'
        required: false
        default: ''
      platforms:
        description: 'Target platform(s)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'amd64'
          - 'arm64'

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('docker-release-manual-{0}', inputs.tag || github.ref) || format('docker-release-push-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tag: ${{ steps.vars.outputs.tag }}
      is_release: ${{ steps.vars.outputs.is_release }}
    steps:
      - name: Get version tag
        id: vars
        shell: bash
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="latest"
          fi
          # Strip leading 'v' if present for clean semantic versioning
          CLEAN_TAG="${TAG#v}"
          echo "tag=$CLEAN_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$CLEAN_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set platform matrix
        id: set-matrix
        shell: bash
        run: |
          CHOICE="${{ github.event.inputs.platforms || 'all' }}"
          if [ "$CHOICE" = "all" ]; then
            echo 'matrix=[{"platform": "linux/amd64", "runner": "ubuntu-latest", "arch": "amd64"}, {"platform": "linux/arm64", "runner": "ubuntu-24.04-arm", "arch": "arm64"}]' >> "$GITHUB_OUTPUT"
          elif [ "$CHOICE" = "arm64" ]; then
            echo 'matrix=[{"platform": "linux/arm64", "runner": "ubuntu-24.04-arm", "arch": "arm64"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"platform": "linux/amd64", "runner": "ubuntu-latest", "arch": "amd64"}]' >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: prepare
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            OPENCLAW_EXTENSIONS=diagnostics-otel,codex
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-release-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-release-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [prepare, build-and-push]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          IS_RELEASE="${{ needs.prepare.outputs.is_release }}"
          IMAGE_URI="ghcr.io/${{ github.repository }}"
          
          tags_args=()
          if [ "$TAG" != "latest" ]; then
            tags_args+=("-t" "${IMAGE_URI}:${TAG}")
            tags_args+=("-t" "${IMAGE_URI}:v${TAG}")
            tags_args+=("-t" "${IMAGE_URI}:${TAG}-slim")
            tags_args+=("-t" "${IMAGE_URI}:v${TAG}-slim")
          fi
          
          if [ "$IS_RELEASE" = "true" ] || [ "$TAG" = "latest" ]; then
            tags_args+=("-t" "${IMAGE_URI}:latest")
            tags_args+=("-t" "${IMAGE_URI}:slim")
            tags_args+=("-t" "${IMAGE_URI}:main")
            tags_args+=("-t" "${IMAGE_URI}:main-slim")
          fi

          echo "Pushing manifest with tags: ${tags_args[*]}"
          
          # Read digests from files created in /tmp/digests
          digest_args=()
          for digest_file in *; do
            [ -f "$digest_file" ] || continue
            digest_args+=("${IMAGE_URI}@sha256:${digest_file}")
          done

          docker buildx imagetools create "${tags_args[@]}" "${digest_args[@]}"

      - name: Inspect image
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          IMAGE_URI="ghcr.io/${{ github.repository }}"
          if [ "$TAG" != "latest" ]; then
            docker buildx imagetools inspect "${IMAGE_URI}:${TAG}"
          else
            docker buildx imagetools inspect "${IMAGE_URI}:latest"
          fi
